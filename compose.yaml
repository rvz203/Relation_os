services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: relationship_os
      POSTGRES_USER: relationship
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relationship -d relationship_os"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://relationship:${POSTGRES_PASSWORD}@db:5432/relationship_os
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://relationship:${POSTGRES_PASSWORD}@db:5432/relationship_os
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - private_uploads:/app/private/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://relationship:${POSTGRES_PASSWORD}@db:5432/relationship_os
    command: ["npm", "run", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
  private_uploads:
